name: YouTube sync

# Pulls the channel's public videos into js/youtube-data.js. Runs every
# 6 hours; after uploading, run it by hand (Actions → YouTube sync → Run
# workflow) to show the new video right away. Optional repo secret
# YOUTUBE_API_KEY adds views, durations, subscriber count and full history.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch channel data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/sync_youtube.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- js/youtube-data.js; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/youtube-data.js
          git commit -m "Sync YouTube data"
          git push
